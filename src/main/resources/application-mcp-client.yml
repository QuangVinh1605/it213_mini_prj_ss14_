spring:
  ai:
    mcp:
      client:
        enabled: true
        name: smarthub-mcp-client
        version: 1.0.0
        type: SYNC
        initialized: true
        stdio:
          connections:
            smarthub-server:
              command: java
              args:
                - "-jar"
                - "build/libs/mini_project_ss14-0.0.1-SNAPSHOT.jar"
                - "--spring.profiles.active=stdio"