spring:
  application:
    name: smarthub

  # === DataSource (PostgreSQL) ===
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:smarthub}
    username: ${DATABASE_USERNAME:smarthub}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # === JPA / Hibernate ===
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # === Flyway ===
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # === Spring AI - OpenAI ===
  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.2
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

    # === Spring AI - PgVector Store ===
    vectorstore:
      pgvector:
        initialize-schema: false
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: 1536

# === Server ===
server:
  port: 8080

# === RAG Configuration ===
rag:
  chunk:
    size: ${RAG_CHUNK_SIZE:500}
    overlap-percent: ${RAG_CHUNK_OVERLAP_PERCENT:10}
  similarity:
    threshold: ${RAG_SIMILARITY_THRESHOLD:0.7}
    top-k: ${RAG_TOP_K:5}
  documents:
    path: classpath:documents/

# === Logging ===
logging:
  level:
    com.example.mini_project_ss14: DEBUG
    org.springframework.ai: INFO
