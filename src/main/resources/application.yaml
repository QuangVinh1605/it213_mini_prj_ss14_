spring:
  application:
    name: smarthub

  # === DataSource (PostgreSQL) ===
  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:5432}/${DATABASE_NAME:smarthub}
    username: ${DATABASE_USERNAME:smarthub}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # === JPA / Hibernate ===
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # === Flyway ===
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # === Spring AI - OpenAI ===
  ai:
    chat:
      observations:
        log-prompt: ${SPRING_AI_CHAT_OBSERVATIONS_LOG_PROMPT:${LLMOPS_CAPTURE_PAYLOADS:true}}
        log-completion: ${SPRING_AI_CHAT_OBSERVATIONS_LOG_COMPLETION:${LLMOPS_CAPTURE_PAYLOADS:true}}
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
          temperature: 0.2
      embedding:
        options:
          model: ${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}

    # === Spring AI - PgVector Store ===
    vectorstore:
      pgvector:
        initialize-schema: false
        index-type: hnsw
        distance-type: cosine_distance
        dimensions: 1536

# === Server ===
server:
  port: 8080

# === RAG Configuration ===
rag:
  chunk:
    size: ${RAG_CHUNK_SIZE:500}
    overlap-percent: ${RAG_CHUNK_OVERLAP_PERCENT:10}
  similarity:
    threshold: ${RAG_SIMILARITY_THRESHOLD:0.7}
    top-k: ${RAG_TOP_K:5}
  documents:
    path: classpath:documents/

# === LLMOps / Langfuse OpenTelemetry Configuration ===
llmops:
  enabled: ${LLMOPS_ENABLED:true}
  provider: openai
  model: ${OPENAI_CHAT_MODEL:gpt-4o-mini}
  capture-payloads: ${LLMOPS_CAPTURE_PAYLOADS:true}
  max-payload-chars: ${LLMOPS_MAX_PAYLOAD_CHARS:4000}
  guard:
    enabled: ${LLMOPS_GUARD_ENABLED:true}
    max-calls-per-window: ${LLMOPS_GUARD_MAX_CALLS_PER_WINDOW:8}
    window-seconds: ${LLMOPS_GUARD_WINDOW_SECONDS:60}
  token:
    estimated-chars-per-token: ${LLMOPS_ESTIMATED_CHARS_PER_TOKEN:4}
  cost:
    input-usd-per-1k-tokens: ${LLMOPS_INPUT_USD_PER_1K_TOKENS:0.00015}
    output-usd-per-1k-tokens: ${LLMOPS_OUTPUT_USD_PER_1K_TOKENS:0.0006}

# === Observability / OpenTelemetry ===
management:
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
  observations:
    annotations:
      enabled: true
    enable:
      "http.server.requests": false
      "http.client.requests": false

otel:
  instrumentation:
    spring-webmvc:
      enabled: false
    spring-web:
      enabled: false

# === Logging ===
logging:
  level:
    com.example.mini_project_ss14: DEBUG
    org.springframework.ai: INFO
