version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: smarthub-postgres
    restart: unless-stopped
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-smarthub}
      POSTGRES_USER: ${DATABASE_USERNAME:-smarthub}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USERNAME:-smarthub}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
