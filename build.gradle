plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.13'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'SmartHub - AI-Powered Smart Logistics Operations Center'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
    maven { url 'https://repo.spring.io/milestone' }
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:1.0.0"
    }
}

dependencies {
    // === Spring Boot Core ===
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // === Spring AI - OpenAI (Chat + Embedding) ===
    implementation 'org.springframework.ai:spring-ai-starter-model-openai'

    // === Spring AI - PgVector Store ===
    implementation 'org.springframework.ai:spring-ai-starter-vector-store-pgvector'

    // === Spring AI - Tika Document Reader ===
    implementation 'org.springframework.ai:spring-ai-tika-document-reader'

    // === Spring AI - Advisors (QuestionAnswerAdvisor) ===
    implementation 'org.springframework.ai:spring-ai-advisors-vector-store'

    // === PostgreSQL Driver ===
    runtimeOnly 'org.postgresql:postgresql'

    // === Flyway - Database Migration ===
    implementation 'org.flywaydb:flyway-core'
    runtimeOnly 'org.flywaydb:flyway-database-postgresql'

    // === Test ===
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // === Spring AI - MCP Server (stdio transport) ===
    implementation 'org.springframework.ai:spring-ai-starter-mcp-server'

    // === Spring AI - MCP Client (stdio transport) ===
    implementation 'org.springframework.ai:spring-ai-starter-mcp-client'
}

tasks.named('test') {
    useJUnitPlatform()
}
